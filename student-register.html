<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration - Rojgar Times India</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

.page-banner{
background:#0b9444;
color:#fff;
text-align:center;
padding:50px 20px;
}

.register-box{
max-width:800px;
margin:40px auto;
background:#fff;
padding:30px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.register-box h2{
color:#0b9444;
text-align:center;
margin-bottom:20px;
}

.form-group{
margin-bottom:15px;
}

.form-group label{
display:block;
margin-bottom:5px;
font-weight:bold;
}

.form-group input,
.form-group select,
.form-group textarea{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:5px;
}

.submit-btn{
width:100%;
background:#0b9444;
color:white;
border:none;
padding:14px;
font-size:16px;
font-weight:bold;
border-radius:5px;
cursor:pointer;
}

.submit-btn:hover{
background:#087536;
}

</style>

</head>

<body>

<section class="page-banner">
<h1>🎓 Student Registration</h1>
<p>Find Best Tutors & Coaching Near You</p>
</section>

<div class="register-box">

<h2>Register as Student</h2>

<form>

<div class="form-group">
<label>Student Name</label>
<input type="text" required>
</div>

<div class="form-group">
<label>Mobile Number</label>
<input type="tel" required>
</div>

<div class="form-group">
<label>Email Address</label>
<input type="email">
</div>

<div class="form-group">
<label>Class</label>
<select>
<option>Class 1-5</option>
<option>Class 6-8</option>
<option>Class 9-10</option>
<option>Class 11-12</option>
<option>Graduation</option>
<option>Competitive Exam</option>
</select>
</div>

<div class="form-group">
<label>Required Subject</label>
<input type="text" placeholder="Math, Science, English etc.">
</div>

<div class="form-group">
<label>Tuition Type</label>
<select>
<option>Home Tuition</option>
<option>Online Tuition</option>
<option>Coaching Institute</option>
<option>Any</option>
</select>
</div>

<div class="form-group">
<label>Location</label>
<input type="text" placeholder="City / District">
</div>

<div class="form-group">
<label>Additional Requirement</label>
<textarea rows="4"></textarea>
</div>

<button type="submit" class="submit-btn">
Find Tutor
</button>

</form>

</div>

<footer>
<div class="copyright">
© 2026 Rojgar Times India | Student Registration
</div>
</footer>

</body>
</html>
