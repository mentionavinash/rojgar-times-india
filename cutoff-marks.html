<!DOCTYPE html>

<title>Cut Off Marks - Rojgar Times India</title>

<link rel="stylesheet" href="css/style.css">

<style>

.page-banner{
background:#6d36d6;

max-width:1200px;
margin:40px auto;
padding:20px;
}

.cutoff-card{
background:white;
padding:25px;
margin-bottom:20px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.cutoff-card h2{
color:#002a72;

.cutoff-table{
width:100%;
border-collapse:collapse;
}

.cutoff-table th{
background:#002a72;
color:white;
padding:12px;
}

.cutoff-table td{
padding:12px;
border:1px solid #ddd;
text-align:center;
}

.cutoff-table tr:nth-child(even){
background:#f5f7fb;
}

</style>
