<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tutor Registration - Rojgar Times India</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

.page-banner{
background:#002a72;
color:#fff;
text-align:center;
padding:50px 20px;
}

.register-box{
max-width:800px;
margin:40px auto;
background:#fff;
padding:30px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.register-box h2{
color:#002a72;
margin-bottom:20px;
text-align:center;
}

.form-group{
margin-bottom:15px;
}

.form-group label{
display:block;
margin-bottom:5px;
font-weight:bold;
}

.form-group input,
.form-group select,
.form-group textarea{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:5px;
}

.submit-btn{
background:#e31e24;
color:#fff;
border:none;
padding:14px 25px;
font-size:16px;
font-weight:bold;
cursor:pointer;
border-radius:5px;
width:100%;
}

.submit-btn:hover{
background:#c4171d;
}

</style>

</head>
<body>

<section class="page-banner">
<h1>👨‍🏫 Tutor Registration</h1>
<p>Join Our Tutor & Coaching Network</p>
</section>

<div class="register-box">

<h2>Register as Tutor</h2>

<form>

<div class="form-group">
<label>Full Name</label>
<input type="text" required>
</div>

<div class="form-group">
<label>Mobile Number</label>
<input type="tel" required>
</div>

<div class="form-group">
<label>Email Address</label>
<input type="email">
</div>

<div class="form-group">
<label>Subject</label>
<input type="text" placeholder="Math, English, Science etc.">
</div>

<div class="form-group">
<label>Class Level</label>
<select>
<option>Class 1-5</option>
<option>Class 6-8</option>
<option>Class 9-10</option>
<option>Class 11-12</option>
<option>Competitive Exams</option>
</select>
</div>

<div class="form-group">
<label>Teaching Mode</label>
<select>
<option>Online</option>
<option>Offline</option>
<option>Both</option>
</select>
</div>

<div class="form-group">
<label>Location</label>
<input type="text" placeholder="City / District">
</div>

<div class="form-group">
<label>Experience</label>
<input type="text" placeholder="e.g. 3 Years">
</div>

<div class="form-group">
<label>About Yourself</label>
<textarea rows="4"></textarea>
</div>

<button type="submit" class="submit-btn">
Register Now
</button>

</form>

</div>

<footer>
<div class="copyright">
© 2026 Rojgar Times India | Tutor Registration
</div>
</footer>

</body>
</html>
